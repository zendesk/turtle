name: CI
on: [push]
jobs:
  main:
    name: npm test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - 20
          - 22
          - 24
    steps:
    - uses: zendesk/checkout@v2
    - uses: zendesk/setup-node@v2
      with:
        node-version: ${{ matrix.version }}
    - name: install
      run: npm install
    - name: node_js ${{ matrix.version }}
      run: npm test
